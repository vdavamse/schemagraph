[project]
name = "schemagraph"
version = "0.1.0"
description = "Graph-native schema context engine for text-to-SQL: catalog metadata in, linked sub-schema out."
readme = "README.md"
requires-python = ">=3.11"
license = "Apache-2.0"
dependencies = [
    "pydantic>=2.8",
    "networkx>=3.3",
    "duckdb>=1.1",
    "sqlglot>=25.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "typer>=0.12",
    "mcp>=1.2,<2",
    "scipy>=1.13",
]

[project.optional-dependencies]
llm = ["anthropic>=1.0"]
glue = ["boto3>=1.34"]
all = ["anthropic>=1.0", "boto3>=1.34"]
embed = [
    "model2vec>=0.3",
]

[project.scripts]
schemagraph = "schemagraph.cli:app"

[dependency-groups]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.6",
    "boto3>=1.34",
    "anthropic>=1.0",
    "tiktoken>=0.14.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/schemagraph"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "D", "C901"]
ignore = ["E501", "D105", "D107"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.ruff.lint.mccabe]
max-complexity = 12

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["D"]
# TEMP (#8): removed as each module is refactored; empty at merge
"src/schemagraph/**/__init__.py" = ["D"]
"src/schemagraph/api/app.py" = ["D", "C901"]
"src/schemagraph/bench/**" = ["D", "C901"]
"src/schemagraph/cli.py" = ["D", "C901"]
"src/schemagraph/connectors/**" = ["D", "C901"]
"src/schemagraph/engine.py" = ["D", "C901"]
"src/schemagraph/graph/infer.py" = ["D", "C901"]
"src/schemagraph/graph/pathfinding.py" = ["D", "C901"]
"src/schemagraph/graph/ppr.py" = ["D", "C901"]
"src/schemagraph/graph/pruning.py" = ["D", "C901"]
"src/schemagraph/linking/**" = ["D", "C901"]
"src/schemagraph/llm/**" = ["D", "C901"]
"src/schemagraph/mcp/**" = ["D", "C901"]
"src/schemagraph/model.py" = ["D", "C901"]
"src/schemagraph/store.py" = ["D", "C901"]
