<title>Schema Linking Walkthrough</title>
<style>
:root {

  :root:not([data-theme="light"]) {

    --node: #2a303b; --node-stroke: #6d7686;

  }
}
:root[data-theme="dark"] {
  --bg: #12151b; --surface: #1b1f27; --ink: #e9ecf2; --muted: #9aa3b2; --line: #3a404c;
  --node: #2a303b; --node-stroke: #6d7686;
  --heat: #ff8a3d; --accent: #5b9dff; --path: #b18cff; --fill: #3fcf8e; --cut: #ff6b6b;
  --gold: #ffd34d; --chip: #1f3255; --chip-ink: #cfe0ff; --code: #151920;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.3);
}
* { box-sizing: border-box; }
html, body { margin: 0; height: 100vh; }
body {
  background: var(--bg); color: var(--ink);
  font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
  display: grid; grid-template-rows: auto minmax(0, 1fr) auto; overflow-x: hidden;
}
header { padding: 12px 20px 8px; display: flex; gap: 18px; align-items: baseline; flex-wrap: wrap; }
header h1 { font-size: 19px; margin: 0; letter-spacing: -.01em; }
header .meta { color: var(--muted); font-size: 13px; }
.question { flex-basis: 100%; margin: 2px 0 0; font-size: 15px; color: var(--ink); }
.question q { font-style: italic; }
main {
  display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(340px, 1fr);
  gap: 14px; padding: 0 20px; min-height: 0;
}
.canvas, .panel { background: var(--surface); border-radius: 12px; box-shadow: var(--shadow); min-height: 0; }
.canvas { position: relative; display: flex; flex-direction: column; }
.canvas svg { width: 100%; height: 100%; min-height: 0; flex: 1; display: block; }
.overlay { padding: 0 14px; font-size: 13px; color: var(--muted); min-height: 1.4em; }
.legend { display: flex; flex-wrap: wrap; gap: 6px 16px; padding: 6px 14px 10px; font-size: 12.5px; color: var(--muted); }
.legend span { display: inline-flex; gap: 6px; align-items: center; }
.sw { width: 12px; height: 12px; border-radius: 50%; display: inline-block; border: 2px solid transparent; }
.panel { padding: 16px 18px; overflow-y: auto; }
.kicker { font-size: 12px; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); }
.panel h2 { font-size: 21px; margin: 2px 0 8px; letter-spacing: -.01em; }
.panel p { margin: 0 0 10px; }
.panel .callout { border-left: 3px solid var(--gold); padding: 6px 10px; background: color-mix(in srgb, var(--gold) 10%, transparent); border-radius: 0 6px 6px 0; margin: 10px 0; font-size: 14px; }
.panel .callout.bad { border-color: var(--cut); background: color-mix(in srgb, var(--cut) 10%, transparent); }
.big { font-size: 26px; font-weight: 650; font-variant-numeric: tabular-nums; }
.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin: 8px 0 12px; }
.stats div { background: var(--bg); border-radius: 8px; padding: 6px 10px; }
.stats small { display: block; color: var(--muted); font-size: 12px; }
table.mini { width: 100%; border-collapse: collapse; font-size: 13.5px; font-variant-numeric: tabular-nums; }
table.mini th { text-align: left; font-weight: 600; color: var(--muted); font-size: 12px; padding: 3px 4px; border-bottom: 1px solid var(--line); }
table.mini td { padding: 3px 4px; border-bottom: 1px solid color-mix(in srgb, var(--line) 50%, transparent); vertical-align: top; }
td.num, th.num { text-align: right; }
code, .mono { font-family: ui-monospace, "SF Mono", Menlo, Consolas, monospace; font-size: 12.5px; }
.tag { display: inline-block; font-size: 11.5px; padding: 0 6px; border-radius: 9px; border: 1px solid currentColor; line-height: 17px; white-space: nowrap; }
.tag.anchor { color: var(--accent); } .tag.path { color: var(--path); } .tag.fill { color: var(--fill); }
.tag.cut { color: var(--cut); } .tag.gold { color: var(--gold); } .tag.seed { color: var(--heat); }
.bars { display: grid; grid-template-columns: 9.5em 1fr 1fr 4.2em; gap: 3px 8px; align-items: center; font-size: 13px; font-variant-numeric: tabular-nums; }
.bars .hdr { font-size: 12px; color: var(--muted); font-weight: 600; }
.bar { position: relative; height: 16px; background: var(--bg); border-radius: 4px; overflow: hidden; }
.bar i { position: absolute; inset: 0 auto 0 0; width: 0; border-radius: 4px; transition: width .7s cubic-bezier(.2,.7,.2,1); }
.bar b { position: absolute; left: 5px; top: 0; font-size: 11px; line-height: 16px; font-weight: 600; color: var(--ink); }
.bar.ppr i { background: color-mix(in srgb, var(--heat) 70%, transparent); }
.bar.bm25 i { background: color-mix(in srgb, var(--accent) 60%, transparent); }
.bar.ev i { background: color-mix(in srgb, var(--accent) 55%, transparent); }
.bar .gate { position: absolute; top: -2px; bottom: -2px; width: 2px; background: var(--ink); opacity: .7; }
.fused { font-weight: 650; text-align: right; }
.rowname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.rowname.anchor { color: var(--accent); font-weight: 650; }
pre.ddl { background: var(--code); border-radius: 8px; padding: 10px 12px; max-height: 40vh; overflow: auto; margin: 8px 0 0; font-size: 12px; line-height: 1.4; white-space: pre; }
.seg { display: inline-flex; border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin: 4px 0 6px; }
.seg button { border: 0; background: transparent; color: var(--ink); padding: 4px 10px; font: inherit; font-size: 13px; cursor: pointer; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
nav.stepper { display: flex; align-items: center; gap: 10px; padding: 10px 20px 12px; flex-wrap: wrap; }
.ctrl { width: 38px; height: 34px; border-radius: 8px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); font-size: 16px; cursor: pointer; }
.ctrl:hover { border-color: var(--accent); }
.stages { display: flex; gap: 4px; flex: 1; flex-wrap: wrap; }
.stages button { flex: 1 1 auto; min-width: 74px; border: 1px solid var(--line); background: var(--surface); color: var(--muted); border-radius: 8px; padding: 6px 8px; font: inherit; font-size: 13px; cursor: pointer; position: relative; overflow: hidden; }
.stages button .n { font-weight: 700; margin-right: 4px; }
.stages button[aria-current="step"] { color: var(--ink); border-color: var(--accent); background: color-mix(in srgb, var(--accent) 12%, var(--surface)); }
.stages button .prog { position: absolute; left: 0; bottom: 0; height: 3px; width: 0; background: var(--accent); }
button:focus-visible, [tabindex]:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
.hint { color: var(--muted); font-size: 12px; }
#tip { position: fixed; pointer-events: none; z-index: 10; max-width: 340px; background: var(--ink); color: var(--bg); padding: 7px 10px; border-radius: 8px; font-size: 12.5px; line-height: 1.4; opacity: 0; transition: opacity .12s; white-space: pre-line; }
/* SVG */
.edge { stroke: var(--line); stroke-width: 1.6; transition: opacity .5s, stroke .5s; }
.edge.dim { opacity: .25; }
.pathline { stroke: var(--path); stroke-width: 5; stroke-linecap: round; fill: none; opacity: .85; transition: stroke-dashoffset 0.9s ease-in-out; }
.link { fill: none; stroke: var(--heat); stroke-linecap: round; transition: stroke-dashoffset .7s ease-out, opacity .4s; }
.node { cursor: default; transition: opacity .5s; }
.node .base { fill: var(--node); stroke: var(--node-stroke); stroke-width: 1.5; transition: fill .5s, stroke .5s; }
.node .heat { fill: var(--heat); transition: opacity .55s; }
.node .ring { fill: none; stroke: var(--accent); stroke-width: 4; opacity: 0; transform-box: fill-box; transform-origin: center; transition: opacity .4s, transform .5s cubic-bezier(.2,1.6,.4,1); transform: scale(1.6); }
.node .ring.on { opacity: 1; transform: scale(1); }
.node .bridge { fill: none; stroke: var(--path); stroke-width: 3; stroke-dasharray: 5 4; opacity: 0; transition: opacity .4s; }
.node .label { font-size: 14px; fill: var(--ink); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; stroke-linejoin: round; text-anchor: middle; font-weight: 550; }
.node .sub { font-size: 12.5px; fill: var(--muted); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; text-anchor: middle; }
.node .badge circle { fill: var(--ink); }
.node .badge text { fill: var(--surface); font-size: 12px; font-weight: 700; text-anchor: middle; dominant-baseline: central; }
.node .badge, .node .star, .node .xmark { opacity: 0; transition: opacity .4s; }
.node .star { fill: var(--gold); stroke: var(--surface); stroke-width: 1.5; }
.node .xmark { stroke: var(--cut); stroke-width: 3.5; stroke-linecap: round; }
.node.faded { opacity: .22; }
.node.kept-anchor .base { fill: color-mix(in srgb, var(--accent) 30%, var(--node)); stroke: var(--accent); }
.node.kept-path .base { fill: color-mix(in srgb, var(--path) 30%, var(--node)); stroke: var(--path); }
.node.kept-fill .base { fill: color-mix(in srgb, var(--fill) 30%, var(--node)); stroke: var(--fill); }
.node.cut-gold .base { stroke: var(--cut); stroke-width: 3; stroke-dasharray: 4 3; }
.chip rect { fill: var(--chip); stroke: var(--accent); stroke-width: 1.2; }
.chip text { fill: var(--chip-ink); font-size: 15px; font-weight: 600; text-anchor: middle; dominant-baseline: central; }
.chip.unmatched rect { fill: transparent; stroke: var(--line); stroke-dasharray: 4 3; }
.chip.unmatched text { fill: var(--muted); font-weight: 450; }
.chip { transition: opacity .4s; }
.band-label { font-size: 12px; fill: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
.overlay-title { font-size: 13px; fill: var(--muted); }
body.instant *, body.instant *::before { transition: none !important; }
@media (prefers-reduced-motion: reduce) { *, *::before { transition: none !important; animation: none !important; } }
@media (max-width: 980px) {
  body { display: block; }
  main { grid-template-columns: minmax(0, 1fr); }
  .canvas svg { height: auto; }
  .panel { max-height: none; }
  .stages button { min-width: 0; }
}
</style>

  const lines = [`${fqn} · ${t.ncols} columns`];
  if (stage >= 1 && seedsByTable[fqn]) lines.push("seeds: " + seedsByTable[fqn].map((s) => `${s.column || "(name)"} +${f2(s.weight)}`).join(", "));
  if (stage >= 2 && r) lines.push(`PPR evidence ${f2(r.pprRel)} · top columns: ${r.topColumns.map((c) => c[0]).join(", ") || "-"}`);
  if (stage >= 3 && r) lines.push(`rank: PPR #${r.pprRank ?? "-"}, BM25F #${r.bm25Rank ?? "-"} → fused #${r.fusedRank}`);
  if (stage >= 4) lines.push(anchors.has(fqn) ? "anchor" : `evidence ${f2(r ? r.evidence : 0)}`);
  if (stage === 6 || stage === 8 && ctx === "default") lines.push(keptDefault[fqn] ? `kept: ${keptDefault[fqn]}` : "dropped");
  if (stage === 7 || stage === 8 && ctx === "tight") lines.push(keptTight[fqn] ? `kept: ${keptTight[fqn]}` : "dropped");
  if (gold.has(fqn) && stage >= 6) lines.push("★ read by the gold SQL");
  return lines.join("\n");
}
function showTip(evt, text) {
  tip.textContent = text; tip.style.opacity = 1;
  const x = Math.min(evt.clientX + 14, window.innerWidth - 350);
  tip.style.left = x + "px"; tip.style.top = (evt.clientY + 14) + "px";
}
$("svg").addEventListener("pointermove", (evt) => {
  const node = evt.target.closest(".node");
  const target = node ? null : evt.target.closest("[data-tip]");
  if (node) showTip(evt, nodeTip(node.getAttribute("aria-label").slice(6)));
  else if (target) showTip(evt, target.dataset.tip);
  else tip.style.opacity = 0;
});
$("svg").addEventListener("pointerleave", () => (tip.style.opacity = 0));
for (const [fqn, n] of Object.entries(nodeEls)) {
  n.g.addEventListener("focus", () => { const b = n.g.getBoundingClientRect(); showTip({ clientX: b.right, clientY: b.top }, nodeTip(fqn)); });
  n.g.addEventListener("blur", () => (tip.style.opacity = 0));
}

// ------------------------------------------------------------------ stage machinery
let stage = 0, ctx = "tight", playing = false, timers = [], playTimer = null;
const instant = () => reduced || still;
function later(ms, fn) { if (instant()) fn(); else timers.push(setTimeout(fn, ms)); }
function clearTimers() { timers.forEach(clearTimeout); timers = []; }

function resetScene() {
  for (const [fqn, n] of Object.entries(nodeEls)) {
    n.g.setAttribute("class", "node");
    n.heat.setAttribute("opacity", 0);
    n.ring.classList.remove("on");
    n.bridge.style.opacity = 0;
    n.badge.style.opacity = 0;
    n.star.style.opacity = 0;
    n.xmark.style.opacity = 0;
    n.sub.textContent = "";
  }
  edgeEls.forEach(({ line }) => line.classList.remove("dim"));
  $("pathsLayer").replaceChildren();
  linkEls.forEach(({ path }) => path.setAttribute("opacity", 0));
  // The question words stay on screen as context after the activation stage.
  Object.values(chipEls).forEach((c) => c.g.setAttribute("opacity", stage === 0 ? 0.35 : stage === 1 ? 0 : 0.6));
  $("overlay").textContent = "";
}
function setHeat(map, scale = 1) {
  for (const [fqn, n] of Object.entries(nodeEls)) n.heat.setAttribute("opacity", ((map[fqn] || 0) * 0.92 * scale).toFixed(3));
}
function drawStroke(path, delay) {
  const len = path.getTotalLength();
  path.style.transition = "none";
  path.style.strokeDasharray = `${len} ${len}`;
  path.style.strokeDashoffset = instant() ? 0 : len;
  path.getBoundingClientRect();
  path.style.transition = "";
  later(delay, () => (path.style.strokeDashoffset = 0));
}
function showGold() { for (const fqn of gold) if (nodeEls[fqn]) nodeEls[fqn].star.style.opacity = 1; }
function legend(items) {
  $("legend").innerHTML = items.map(([style, text]) => `<span><i class="sw" style="${style}"></i>${text}</span>`).join("");
}
const LEG = {
  heat: ["background:var(--heat)", "activation / score (darker = higher)"],
  anchor: ["border-color:var(--accent)", "anchor table"],
  bridge: ["border:2px dashed var(--path)", "bridge table pulled in by a path"],
  path: ["background:var(--path)", "kept: on a join path"],
  fill: ["background:var(--fill)", "kept: budget fill"],
  kanchor: ["background:var(--accent)", "kept: anchor"],
  gold: ["background:var(--gold);border-radius:2px", "★ table the gold SQL reads"],
  faded: ["background:var(--node);opacity:.4", "not kept"],
  edge: ["background:var(--line);border-radius:2px;height:3px", "inferred join (naming convention)"],
};

// Each stage: [short name, title, panel html builder, scene animator].
const STAGES = [
  ["Schema", "The schema graph", panelSchema, sceneSchema],
  ["Seeds", "1 · Lexical activation", panelSeeds, sceneSeeds],
  ["PageRank", "2 · Personalized PageRank", panelPPR, scenePPR],
  ["Ranking", "3 · Rank fusion: PPR + BM25F", panelRanking, sceneRanking],
  ["Anchors", "4 · Anchor tables", panelAnchors, sceneAnchors],
  ["Paths", "5 · Join paths between anchors", panelPaths, scenePaths],
  ["Budget", "6 · Budget: what the default keeps", panelBudget, sceneBudget],
  ["Tight", "7 · The tight context (7 tables)", panelTight, sceneTight],
  ["DDL", "8 · Columns and the final DDL", panelDDL, sceneDDL],
];
const DWELL = [6000, 9000, 9000, 9000, 7000, 10000, 8000, 9000, 12000];

function go(s, { fromPlay = false } = {}) {
  stage = Math.max(0, Math.min(STAGES.length - 1, s));
  clearTimers();
  document.body.classList.add("instant");
  resetScene();
  $("svg").getBoundingClientRect();
  if (!instant()) document.body.classList.remove("instant");
  const [, title, panel, scene] = STAGES[stage];
  $("panel").innerHTML = `<div class="kicker">Stage ${stage} of ${STAGES.length - 1}</div><h2>${title}</h2>` + panel();
  scene();
  wirePanel();
  [...$("stages").children].forEach((b, i) => {
    b.toggleAttribute("aria-current", false);
    if (i === stage) b.setAttribute("aria-current", "step");
    b.querySelector(".prog").style.width = i < stage ? "100%" : "0";
  });
  history.replaceState(null, "", `?stage=${stage}` + (still ? "&still" : ""));
  if (playing) schedulePlay(); else if (!fromPlay) stopPlay();
}
function schedulePlay() {
  clearTimeout(playTimer);
  const bar = $("stages").children[stage].querySelector(".prog");
  bar.style.transition = "none"; bar.style.width = "0"; bar.getBoundingClientRect();
  bar.style.transition = `width ${DWELL[stage]}ms linear`; bar.style.width = "100%";
  playTimer = setTimeout(() => {
    if (stage < STAGES.length - 1) go(stage + 1, { fromPlay: true }); else stopPlay();
  }, DWELL[stage]);
}
function startPlay() { playing = true; $("play").innerHTML = "&#10074;&#10074;"; $("play").setAttribute("aria-label", "Pause"); if (stage === STAGES.length - 1) go(0, { fromPlay: true }); else schedulePlay(); }
function stopPlay() {
  playing = false; clearTimeout(playTimer);
  $("play").innerHTML = "&#9654;"; $("play").setAttribute("aria-label", "Play");
  const bar = $("stages").children[stage]?.querySelector(".prog");
  if (bar) { bar.style.transition = "none"; bar.style.width = "0"; }
}

STAGES.forEach(([name], i) => {
  const b = document.createElement("button");
  b.innerHTML = `<span class="n">${i}</span>${name}<span class="prog"></span>`;
  b.setAttribute("aria-label", `Stage ${i}: ${STAGES[i][1]}`);
  b.addEventListener("click", () => go(i));
  $("stages").appendChild(b);
});
$("prev").addEventListener("click", () => go(stage - 1));
$("next").addEventListener("click", () => go(stage + 1));
$("play").addEventListener("click", () => (playing ? stopPlay() : startPlay()));
document.addEventListener("keydown", (evt) => {
  if (evt.target.closest?.("button") && (evt.key === " " || evt.key === "Enter")) return;
  if (evt.key === "ArrowRight") { go(stage + 1); evt.preventDefault(); }
  else if (evt.key === "ArrowLeft") { go(stage - 1); evt.preventDefault(); }
  else if (evt.key === " ") { playing ? stopPlay() : startPlay(); evt.preventDefault(); }
  else if (/^[0-8]$/.test(evt.key)) go(Number(evt.key));
});
function wirePanel() {
  for (const b of $("panel").querySelectorAll("[data-ctx]")) {
    b.addEventListener("click", () => { ctx = b.dataset.ctx; go(stage); });
  }
  requestAnimationFrame(() => {
    for (const i of $("panel").querySelectorAll(".bar i[data-w]")) {
      if (instant()) i.style.transition = "none";
      i.style.width = i.dataset.w;
    }
  });
}

// ------------------------------------------------------------------ stage 0: schema
function panelSchema() {
  const gs = DATA.graphStats;
  return `<p>Every table is a node; two tables that can be joined share one <b>relation</b> edge.
  This SQLite database declares no foreign keys, so all ${DATA.edges.length} edges are
  <b>inferred</b> from naming conventions (<code>batting.player_id = player.player_id</code>)
  and carry the highest join cost, 2.5.</p>
  <div class="stats">
    <div><span class="big">${nTables}</span><small>tables</small></div>

    <div><span class="big">${gs.nodes.token || 0}</span><small>token nodes</small></div>
  </div>
  <p>Behind the picture the graph is larger: each column is a node hanging off its table, and each
  word of the schema vocabulary is a <code>w:</code> token node linked to the objects it names

  <p class="hint">Node size grows with column count. Hover a node or an edge for details.</p>`;

function sceneSchema() { legend([LEG.edge]); $("overlay").textContent = `${nTables} tables · ${DATA.edges.length} relation edges`; }

// ------------------------------------------------------------------ stage 1: seeds
function panelSeeds() {

  const top = DATA.seeds.slice(0, 7);
  const goldNote = [...gold].map((g) => {
    const s = seedsByTable[g] || [];
    return `<b>${g}</b>: ${s.length ? s.map((x) => `${x.column || "(name)"} via “${x.words.join(", ")}”`).join("; ") : "no seed"}`;
  }).join("<br>");

  <div class="stats">

    <div><span class="big">${Object.keys(seedMass).length}</span><small>tables touched</small></div>

  ${top.map((s) => `<tr><td class="mono">${s.table}${s.column ? "." + s.column : ""}</td><td class="num">${f2(s.weight)}</td><td>${esc(s.reasons.slice(0, 2).join(", "))}</td></tr>`).join("")}

function sceneSeeds() {
  legend([LEG.heat, ["background:var(--chip);border-color:var(--accent)", "word that seeds the schema"], ["border:2px dashed var(--line)", "word with no match"]]);
  const words = DATA.chips.map((c) => c.word);
  words.forEach((w, i) => later(120 * i, () => chipEls[w].g.setAttribute("opacity", 1)));
  const start = 120 * words.length + 200;
  const seededWords = words.filter((w) => DATA.chips.find((c) => c.word === w).seeded);
  const mass = {};
  seededWords.forEach((w, i) => {
    later(start + i * 900, () => {
      for (const { l, path } of linkEls) {
        if (l.word !== w) continue;
        path.setAttribute("opacity", Math.min(0.85, 0.25 + l.weight / 3));
        drawStroke(path, 0);
        mass[l.table] = (mass[l.table] || 0) + l.weight;
      }
      const best = Math.max(...Object.values(mass));
      later(instant() ? 0 : 450, () => setHeat(Object.fromEntries(Object.entries(seedMass).map(([t]) => [t, (mass[t] || 0) / Math.max(best, maxSeed * 0.6)]))));
    });
  });
  later(start + seededWords.length * 900 + 300, () => setHeat(Object.fromEntries(Object.entries(seedMass).map(([t, m]) => [t, m / maxSeed]))));
}

// ------------------------------------------------------------------ stage 2: PPR

  const top = [...fusedRows].sort((a, b) => b.pprWalk - a.pprWalk).slice(0, 6);
  const bestWalk = top[0].pprWalk;
  return `<p>The seeds become the teleport distribution of a random walk (HippoRAG). At each step the walker
  either follows an edge (probability ${DATA.options.ppr_alpha}) or jumps back to a seed. Mass flows from seeded
  columns to their tables, across joins, and through shared vocabulary, so a table <i>near</i> many seeds
  heats up even if the question never names it.</p>
  <p class="big" id="pprStep">step 0</p>
  <table class="mini"><tr><th>table</th><th class="num">walk score (rel.)</th><th>hottest columns</th></tr>
  ${top.map((r) => `<tr><td class="mono">${r.fqn}</td><td class="num">${f2(r.pprWalk / bestWalk)}</td><td class="mono">${r.topColumns.slice(0, 3).map((c) => c[0]).join(", ")}</td></tr>`).join("")}
  </table>
  <p class="hint">Table score = own node + best column + ½ second + ¼ third + 0.02 × the rest ("top3").
  After the walk converges, tables with direct seeds get a bonus (PPR dilutes direct evidence); the last frame shows that.</p>`;
}
function scenePPR() {
  legend([LEG.heat]);
  const frames = DATA.ppr;
  const bonus = Object.fromEntries(fusedRows.map((r) => [r.fqn, r.pprRel]));
  const all = [...frames.map((f) => [f.step === "converged" ? "converged" : `step ${f.step}`, f.heat]), ["converged + direct bonus", bonus]];
  all.forEach(([label, heat], i) => later(i * 750, () => {
    setHeat(heat);
    const node = $("pprStep"); if (node) node.textContent = label;
    $("overlay").textContent = `PPR, ${label} (each frame scaled to its hottest table)`;
  }));
}

// ------------------------------------------------------------------ stage 3: ranking

  <div class="bars">
    <span class="hdr">table</span><span class="hdr">PPR (rel.)</span><span class="hdr">BM25F (rel.)</span><span class="hdr" style="text-align:right">fused</span>
    ${rows.map((r) => `<span class="rowname">${r.fusedRank}. ${r.fqn}</span>
      <span class="bar ppr" title="PPR rank ${r.pprRank}"><i data-w="${pct(r.pprRel)}"></i><b>#${r.pprRank ?? "-"}</b></span>
      <span class="bar bm25" title="BM25F rank ${r.bm25Rank} (score ${r.bm25})"><i data-w="${pct(r.bm25Rel)}"></i><b>#${r.bm25Rank ?? "-"}</b></span>
      <span class="fused" title="1/(${k}+${r.pprRank}) + 1/(${k}+${r.bm25Rank})">${(r.fused * 1000).toFixed(1)}</span>`).join("")}

  <p class="hint" style="margin-top:8px">Fused score × 1000. ${R.batting ? `<code>batting</code> (gold) is fused #${R.batting.fusedRank} of ${fusedRows.length}: PPR #${R.batting.pprRank}, BM25F #${R.batting.bm25Rank}.` : ""}</p>`;
}
function sceneRanking() {

// ------------------------------------------------------------------ stage 4: anchors
function panelAnchors() {

  return `<p>Anchors are the tables the answer is built around: the top <b>${a.k}</b> of the fused ranking,
  but only if their <i>evidence</i> (score relative to the best table, under either ranker) is at least
  <b>${a.minRatio}</b>. The fused score is rank-based and flat, so the gate reads evidence instead.</p>
  <div class="stats"><div><span class="big">${qualified}</span><small>pass the ${a.minRatio} gate</small></div>
  <div><span class="big">${a.anchors.length}</span><small>anchors</small></div>
  <div><span class="big">${DATA.options.adaptive_widened ? "yes" : "no"}</span><small>large-schema widening (&gt;${DATA.options.large_threshold})</small></div></div>
  <div class="bars" style="grid-template-columns: 10.5em 1fr 3.4em">
  ${rows.map((r) => `<span class="rowname ${r.anchor ? "anchor" : ""}">${r.anchor ? "◎ " : ""}${r.fqn}</span>

  setHeat(Object.fromEntries(fusedRows.map((r) => [r.fqn, r.evidence * 0.55])));
  for (const r of DATA.anchors.rows) if (!r.qualified) nodeEls[r.fqn].g.classList.add("faded");
  DATA.anchors.anchors.forEach((fqn, i) => later(250 + i * 380, () => {
    const n = nodeEls[fqn]; n.ring.classList.add("on"); n.badgeText.textContent = R[fqn].fusedRank; n.badge.style.opacity = 1;
  }));

// ------------------------------------------------------------------ stage 5: paths
function panelPaths() {
  const p = DATA.paths;
  const offPath = DATA.anchors.anchors.filter((a) => !pathTables.has(a));
  const pattern = pathPattern(p.pruned);
  return `<p>To make the sub-schema <b>join-complete</b>, the linker connects every pair of anchors with all
  of their cheapest join paths (Yen's k-shortest simple paths, SchemaGraphSQL). Tables in the middle of a
  path are <b>bridges</b>: nothing in the question names them, but the SQL needs them to join.</p>
  <div class="stats"><div><span class="big">${p.candidates}</span><small>candidate paths (${p.hops[0]}–${p.hops.at(-1)} hops)</small></div>
  <div><span class="big">${p.union.length}</span><small>tables on them</small></div>
  <div><span class="big">${p.pruned.length}</span><small>kept after pruning</small></div></div>
  <p>PathRAG flow pruning scores each path by the evidence flowing from anchor to anchor and keeps the top
  ${p.pruneTopK}. ${pattern ? `Here they all run <code>${pattern.before.join(" → ")} → <i>X</i> → ${pattern.after.join(" → ")}</code>, with a different table <i>X</i> in the middle:` : "The kept paths:"}</p>
  <table class="mini"><tr><th>${pattern ? "X" : "path"}</th><th class="num">reliability</th></tr>
  ${p.pruned.map((x) => {
    const middle = pattern ? [x.tables[pattern.at]] : x.tables;
    const label = middle.map((t) => `${t}${anchors.has(t) ? " (anchor)" : bridges.has(t) ? " (bridge)" : ""}${gold.has(t) ? " ★" : ""}`).join(" → ");
    return `<tr><td class="mono">${label}</td><td class="num">${x.reliability.toFixed(3)}</td></tr>`;
  }).join("")}
  </table>
  ${offPath.length ? `<p class="hint">Anchor${offPath.length > 1 ? "s" : ""} on no kept path: ${offPath.join(", ")} (still kept as anchor).</p>` : ""}`;
}
function pathPattern(paths) {
  // The position where all paths differ, when they agree everywhere else (else null).
  const n = paths[0]?.tables.length;
  if (!n || paths.some((x) => x.tables.length !== n)) return null;
  const varying = [...Array(n).keys()].filter((i) => new Set(paths.map((x) => x.tables[i])).size > 1);
  if (varying.length !== 1) return null;
  const at = varying[0];
  return { at, before: paths[0].tables.slice(0, at), after: paths[0].tables.slice(at + 1) };
}
function scenePaths() {
  legend([LEG.anchor, ["background:var(--path);border-radius:2px;height:5px", "pruned join path"], LEG.bridge]);
  for (const t of DATA.tables) {
    if (!union.has(t.fqn)) nodeEls[t.fqn].g.classList.add("faded");
  }
  edgeEls.forEach(({ e, line }) => { if (!(union.has(e.a) && union.has(e.b))) line.classList.add("dim"); });
  for (const fqn of anchors) nodeEls[fqn].ring.classList.add("on");
  const drawn = new Set();
  DATA.paths.pruned.forEach((p, i) => later(400 + i * 650, () => {
    for (const s of p.steps) {
      const key = [s.from, s.to].sort().join("|");
      if (drawn.has(key)) continue;
      drawn.add(key);
      const a = T[s.from], b = T[s.to];
      const line = el("path", { class: "pathline", d: `M${a.x},${a.y}L${b.x},${b.y}` }, $("pathsLayer"));
      line.dataset.tip = `${s.kind}: ${s.on}`;
      drawStroke(line, 20);
    }
    for (const t of p.tables) if (bridges.has(t)) nodeEls[t].bridge.style.opacity = 1;
    $("overlay").textContent = `path ${i + 1}/${DATA.paths.pruned.length}: ${p.tables.join(" → ")}`;
  }));
  later(400 + DATA.paths.pruned.length * 650 + 400, () => ($("overlay").textContent = "faded = on no candidate path"));
}

// ------------------------------------------------------------------ stages 6-7: budget cuts
function keptClass(why) { return why === "anchor" ? "kept-anchor" : why === "join path" ? "kept-path" : "kept-fill"; }
function sceneCut(kept, ringAnchors, marks = true) {
  legend([LEG.kanchor, LEG.path, LEG.fill, LEG.faded, LEG.gold]);
  showGold();
  const order = [...DATA.tables].sort((a, b) => (R[a.fqn]?.fusedRank ?? 99) - (R[b.fqn]?.fusedRank ?? 99));
  order.forEach((t, i) => later(100 + i * 70, () => {
    const n = nodeEls[t.fqn];
    if (kept[t.fqn]) { n.g.classList.add(keptClass(kept[t.fqn])); if (ringAnchors && anchors.has(t.fqn)) n.ring.classList.add("on"); }
    else {
      n.g.classList.add("faded"); if (marks) n.xmark.style.opacity = 1;
      if (gold.has(t.fqn)) { n.g.classList.remove("faded"); n.g.classList.add("cut-gold"); }
    }
  }));
  edgeEls.forEach(({ e, line }) => { if (!(kept[e.a] && kept[e.b])) line.classList.add("dim"); });
}
function reasonCounts(list) {
  const c = {}; for (const k of list) c[k.why] = (c[k.why] || 0) + 1; return c;
}
function panelBudget() {
  const b = DATA.budget, c = reasonCounts(b.kept);
  return `<p>The table budget is <b>max_tables = ${b.maxTables}</b>. ${b.bypass
    ? `The whole schema (${nTables} tables) fits, so <b>bypass_if_fits</b> keeps <b>everything</b>; anchors and paths above were still computed and shape the DDL.`
    : `The schema has ${nTables} tables, more than ${b.maxTables}, so <b>no bypass</b> (and ${nTables} ≤ ${DATA.options.large_threshold}, so no large-schema widening).`}
  Anchors and path tables come first; the next-ranked tables with evidence ≥ ${b.fillRatio} fill the rest;
  then everything is cut to the best ${b.maxTables} by fused score.</p>
  <div class="stats"><div><span class="big">${c["anchor"] || 0}</span><small><span class="tag anchor">anchor</span></small></div>
  <div><span class="big">${c["join path"] || 0}</span><small><span class="tag path">join path</span></small></div>
  <div><span class="big">${c["fill"] || 0}</span><small><span class="tag fill">fill</span></small></div></div>
  <table class="mini"><tr><th>dropped (${b.dropped.length})</th><th>why</th></tr>
  ${b.dropped.map((d) => `<tr><td class="mono">${d.fqn}</td><td>${d.why}</td></tr>`).join("")}</table>
  ${[...gold].every((g) => keptDefault[g]) && gold.size ? `<div class="callout">Both gold tables (${[...gold].join(", ")}) are in the default context; <code>batting</code> only as a join-path bridge.</div>` : ""}`;
}
function sceneBudget() { sceneCut(keptDefault, true); $("overlay").textContent = `default options: ${DATA.budget.kept.length} of ${nTables} tables kept`; }
function panelTight() {
  const t = DATA.tight;
  const cutPath = t.dropped.filter((d) => d.why.startsWith("join path"));
  const lostGold = [...gold].filter((g) => !keptTight[g]);
  const keptBridges = t.kept.filter((k) => k.why === "join path");
  return `<p>The agents' <b>tight</b> action asks for <b>max_tables = 7</b> with no adaptive widening (the
  <b>wide</b> action asks for 20). Anchors and paths are found the same way, but the
  ${t.candidates} candidate tables must now be cut to 7 <b>by fused score</b> — and bridges score low
  because the question never names them.</p>
  <table class="mini"><tr><th>kept (7)</th><th class="num">fused rank</th><th>why</th></tr>
  ${t.kept.map((k) => `<tr><td class="mono">${k.fqn}</td><td class="num">${R[k.fqn]?.fusedRank ?? "-"}</td><td><span class="tag ${keptClass(k.why).slice(5)}">${k.why}</span></td></tr>`).join("")}</table>
  <p style="margin-top:8px">Bridges cut: ${cutPath.map((d) => `<code>${d.fqn}</code> (#${R[d.fqn]?.fusedRank})`).join(", ")}. ${keptBridges.length ? `${keptBridges.map((k) => `<code>${k.fqn}</code>`).join(", ")} survive${keptBridges.length > 1 ? "" : "s"} as the best-scored bridge${keptBridges.length > 1 ? "s" : ""}.` : "No bridge survives."}</p>
  ${lostGold.length ? `<div class="callout bad"><b>${lostGold.join(", ")}</b> is cut: the table holding ${esc(DATA.notes.stats_columns.replace(/^batting stores /, ""))}.
  With the tight context the generator cannot see the statistics the question asks for; this question needs the wide context (or a better lexical match for <i>runs</i>/<i>hits</i>).</div>` : ""}`;
}
function sceneTight() { sceneCut(keptTight, true); $("overlay").textContent = `tight options: ${DATA.tight.kept.length} of ${nTables} tables kept`; }

// ------------------------------------------------------------------ stage 8: columns and DDL
function panelDDL() {
  const cols = DATA.columns[ctx];
  const ddl = DATA.ddl[ctx];
  const tokens = Math.round(ddl.length / 4);
  const capped = cols.filter((t) => t.anchor && t.columns.length < t.total);
  return `<p>Every kept table keeps its primary and join keys and its seeded columns. Anchors keep every column, other tables
  the columns PPR reached; all but the rank-1 table are capped at 40${capped.length ? ` (${capped.map((t) => `<code>${t.fqn}</code>: ${t.columns.length} of ${t.total}`).join(", ")})` : ""}.
  The result is rendered as annotated DDL, join paths included.</p>
  <div class="seg" role="group" aria-label="Context"><button data-ctx="tight" aria-pressed="${ctx === "tight"}">tight (${DATA.tight.kept.length})</button><button data-ctx="default" aria-pressed="${ctx === "default"}">default (${DATA.budget.kept.length})</button></div>
  <table class="mini"><tr><th>table</th><th class="num">cols</th><th>notable columns</th></tr>
  ${cols.map((t) => {
    const notable = t.columns.filter((c) => c.reason).slice(0, 4).map((c) => `<code>${c.name}</code>&thinsp;<span class="tag ${/key/.test(c.reason) ? "path" : "seed"}" title="${esc(c.reason)}">${/key/.test(c.reason) ? "key" : "seed"}</span>`).join(" ");
    return `<tr><td class="mono">${t.anchor ? "◎ " : ""}${t.fqn}${gold.has(t.fqn) ? " ★" : ""}</td><td class="num">${t.columns.length}/${t.total}</td><td>${notable || '<span class="hint">all / PPR-reached</span>'}</td></tr>`;
  }).join("")}</table>
  <p class="hint" style="margin:8px 0 0">${ddl.split("\n").length} lines, ~${tokens.toLocaleString()} tokens</p>
  <pre class="ddl" tabindex="0" aria-label="Rendered DDL">${esc(ddl)}</pre>`;
}
function sceneDDL() {
  const kept = ctx === "tight" ? keptTight : keptDefault;
  sceneCut(kept, false, false);
  for (const t of DATA.columns[ctx]) nodeEls[t.fqn].sub.textContent = `${t.columns.length}/${t.total} cols`;
  $("overlay").textContent = `${ctx} context: kept columns per table`;
}

const initial = Number(params.get("stage"));
if (params.get("ctx")) ctx = params.get("ctx");
go(Number.isFinite(initial) ? initial : 0);
if (params.has("play")) startPlay();
})();
</script>
</body>
</html>
